[project]
name = "mypythonproject"
version = "0.1.3"
description = "A fast and lightweight task manager CLI with beautiful terminal output."
authors = [
    {name = "Albert"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn[standart] (>=0.46.0,<0.47.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
